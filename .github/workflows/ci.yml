name: CI

# Private repo: pushes to main don't trigger CI so routine work doesn't
# spend the org's private-repo Actions minutes. Use workflow_dispatch or a PR
# to run it ad hoc; pushes to release still test, build and deploy.
on:
  push:
    branches: [release]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: donut-party/shared-workflows/.github/workflows/clojure-lib.yml@v1
    secrets: inherit
    with:
      test-cljs: true
